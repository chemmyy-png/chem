---
layout: default
---

<!-- Category & Event Filter Section -->
<div id="post-filter" class="d-flex flex-wrap align-items-center gap-3 mb-4">
  <div>
    <label for="event-filter" class="small text-muted text-uppercase fw-bold d-block mb-1">Event</label>
    <select id="event-filter" class="form-select form-select-sm bg-dark text-light border-secondary">
      <option value="all">All events</option>
    </select>
  </div>

  <div>
    <label for="category-filter" class="small text-muted text-uppercase fw-bold d-block mb-1">Category</label>
    <select id="category-filter" class="form-select form-select-sm bg-dark text-light border-secondary">
      <option value="all">All categories</option>
    </select>
  </div>

  <div class="align-self-end">
    <button id="reset-filter" class="btn btn-sm btn-outline-secondary">Reset</button>
  </div>
</div>

<!-- Posts List -->
<div id="post-list">
  {% for post in site.posts %}
    <article class="card mb-3 post-item" 
             data-event="{{ post.event | default: '' | slugify }}" 
             data-category="{{ post.categories | join: ',' | slugify }}">
      <div class="card-body">
        <h2 class="card-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
        <p class="card-text text-muted">{{ post.description | default: post.excerpt | strip_html | truncate: 150 }}</p>
        <div class="post-meta text-muted small">
          <span><i class="far fa-calendar fa-fw me-1"></i>{{ post.date | date: "%b %d, %Y" }}</span>
          {% if post.categories.size > 0 %}
            <span class="ms-3"><i class="far fa-folder-open fa-fw me-1"></i>{{ post.categories | join: ', ' }}</span>
          {% endif %}
        </div>
      </div>
    </article>
  {% endfor %}
</div>

<!-- Filter JavaScript -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const eventSelect = document.getElementById("event-filter");
  const categorySelect = document.getElementById("category-filter");
  const resetButton = document.getElementById("reset-filter");
  const posts = document.querySelectorAll("#post-list .post-item");

  const events = new Set();
  const categories = new Set();

  posts.forEach(post => {
    const ev = post.getAttribute("data-event");
    const cat = post.getAttribute("data-category");
    if (ev) events.add(ev);
    if (cat) cat.split(',').forEach(c => c && categories.add(c));
  });

  events.forEach(ev => {
    const opt = document.createElement("option");
    opt.value = ev;
    opt.textContent = ev.replace(/-/g, ' ');
    eventSelect.appendChild(opt);
  });

  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat.replace(/-/g, ' ');
    categorySelect.appendChild(opt);
  });

  function filterPosts() {
    const selectedEv = eventSelect.value;
    const selectedCat = categorySelect.value;

    posts.forEach(post => {
      const postEv = post.getAttribute("data-event");
      const postCat = post.getAttribute("data-category");

      const matchEv = (selectedEv === "all" || postEv === selectedEv);
      const matchCat = (selectedCat === "all" || postCat.includes(selectedCat));

      if (matchEv && matchCat) {
        post.style.display = "";
      } else {
        post.style.display = "none";
      }
    });
  }

  eventSelect.addEventListener("change", filterPosts);
  categorySelect.addEventListener("change", filterPosts);

  resetButton.addEventListener("click", function () {
    eventSelect.value = "all";
    categorySelect.value = "all";
    filterPosts();
  });
});
</script>
